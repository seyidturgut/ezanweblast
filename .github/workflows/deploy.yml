name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"
      BUILD_OUTPUT: dist/ezan-vakti-pro-web-2026/browser
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Verify Build Output
        run: |
          if [ ! -d "${BUILD_OUTPUT}" ]; then
            echo "Build output not found: ${BUILD_OUTPUT}"
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh-keyscan -p "${PORT}" -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure Deploy Directory Exists
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -p "${PORT}" "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}'"

      - name: Deploy via Rsync
        run: |
          PORT="${DEPLOY_SSH_PORT:-22}"
          rsync -az --delete \
            -e "ssh -p ${PORT}" \
            "${BUILD_OUTPUT}/" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
