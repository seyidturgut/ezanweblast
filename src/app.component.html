
<!-- Global Ambient Background (Liquid Glass Effect) -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
  <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-primary-500/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[100px] opacity-30 animate-blob"></div>
  <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-500/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[100px] opacity-30 animate-blob" style="animation-delay: 2s"></div>
  <div class="absolute bottom-[-20%] left-[20%] w-[600px] h-[600px] bg-blue-500/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[100px] opacity-30 animate-blob" style="animation-delay: 4s"></div>
</div>

<div class="relative z-10 min-h-screen selection:bg-primary-500/30">
  <app-navbar></app-navbar>
  
  <main>
    <app-hero></app-hero>
    
    <app-radio></app-radio>

    <app-hikmet></app-hikmet>

    <app-features></app-features>
    
    <app-screenshots></app-screenshots>
    
    <app-testimonials></app-testimonials>

    <!-- Final CTA -->
    <section id="download" class="py-32 relative overflow-hidden">
      <!-- Glass Panel Background for CTA -->
      <div class="absolute inset-0 bg-gradient-to-b from-transparent to-primary-500/5 pointer-events-none"></div>

      <div class="max-w-3xl mx-auto px-6 text-center relative z-10">
        <div class="inline-block mb-6 p-4 rounded-full bg-primary-500/10 backdrop-blur-md border border-primary-500/20 animate-float">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-primary-500" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        </div>
        
        <h2 appScrollReveal class="text-4xl md:text-6xl font-bold text-slate-900 dark:text-white mb-8 tracking-tight drop-shadow-sm">
          {{ ts.t().download_cta.title }}
        </h2>
        <p appScrollReveal class="text-slate-600 dark:text-slate-300 mb-12 text-lg md:text-xl font-light">
          {{ ts.t().download_cta.subtitle }}
        </p>
        
        <div appScrollReveal class="flex flex-col sm:flex-row items-center justify-center gap-6">
          <!-- Google Play Button -->
          <a href="https://play.google.com/store/apps/details?id=com.mobilexsoft.ezanvakti&utm_source=emea_Med" target="_blank" class="group relative overflow-hidden bg-slate-900 dark:bg-white text-white dark:text-navy-900 px-8 py-4 rounded-full font-bold text-lg transition-all hover:scale-105 shadow-xl shadow-primary-500/20 hover:shadow-primary-500/40 w-full sm:w-auto flex items-center justify-center">
            <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
            <div class="flex items-center gap-3 relative z-10">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.976c.005.18.067.355.182.5.127.16.31.246.505.246.136 0 .27-.04.385-.12l16.76-11.237c.22-.15.348-.396.345-.66-.003-.266-.137-.51-.362-.656L4.08.31c-.116-.076-.247-.116-.38-.116-.2 0-.387.09-.516.255-.115.15-.175.33-.17.514v20.012zM5.32 3.32l11.66 7.42-11.66 8V3.32z"/></svg>
              <div class="flex flex-col items-start leading-none">
                <span class="text-[10px] uppercase font-medium opacity-80">{{ ts.t().download_cta.play_small }}</span>
                <span class="text-lg font-bold">{{ ts.t().download_cta.play_large }}</span>
              </div>
            </div>
          </a>

          <!-- App Store Button -->
          <a href="https://apps.apple.com/cy/app/ezan-vakti-pro/id437447439?l=tr" target="_blank" class="group relative overflow-hidden bg-slate-200 dark:bg-navy-800 text-slate-900 dark:text-white px-8 py-4 rounded-full font-bold text-lg transition-all hover:scale-105 shadow-xl shadow-black/10 hover:shadow-black/20 w-full sm:w-auto flex items-center justify-center">
            <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
            <div class="flex items-center gap-3 relative z-10">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.74 1.18 0 2.48-1.23 3.93-1.2 2.31.06 3.79 1.54 4.19 1.83-3.6 1.83-2.92 7.21.36 8.52-.39 1.13-1.06 2.49-1.85 3.08zM12.03 5.39c-.97-1.18-.75-2.96.65-4.13 1.25-.97 3.23-.74 3.86.64.09 1.77-1.63 2.97-4.51 3.49z"/></svg>
              <div class="flex flex-col items-start leading-none">
                <span class="text-[10px] uppercase font-medium opacity-80">{{ ts.t().download_cta.app_small }}</span>
                <span class="text-lg font-bold">{{ ts.t().download_cta.app_large }}</span>
              </div>
            </div>
          </a>
        </div>
        <p appScrollReveal class="mt-8 text-sm text-slate-500 dark:text-slate-500 font-medium">{{ ts.t().download_cta.compatibility }}</p>
      </div>
    </section>
  </main>
  
  <app-partners></app-partners>
  <app-delete-account></app-delete-account>
  <app-footer></app-footer>

  <!-- Mobile App Prompt -->
  <app-mobile-app-prompt></app-mobile-app-prompt>

  <!-- Scroll to Top Button (Liquid Glass) -->
  <button 
    (click)="scrollToTop()"
    class="fixed bottom-8 right-8 z-50 p-3 rounded-full bg-white/10 dark:bg-navy-800/40 backdrop-blur-lg border border-white/20 dark:border-white/10 text-slate-800 dark:text-white shadow-lg transition-all duration-300 hover:scale-110 hover:bg-primary-500/20 group"
    [class.opacity-0]="!showScrollTop()"
    [class.translate-y-10]="!showScrollTop()"
    [class.opacity-100]="showScrollTop()"
    [class.translate-y-0]="showScrollTop()"
    [class.pointer-events-none]="!showScrollTop()"
    aria-label="Yukarı Çık"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 group-hover:-translate-y-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
    </svg>
  </button>
</div>
